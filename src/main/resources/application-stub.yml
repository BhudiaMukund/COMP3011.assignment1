# Profile: stub
#
# Replaces real cloud speech-to-text call with a fake.
# Used by regression test and offline local development, so that the
# application can be used end to end without credentials or network
# access. Activated with --spring.profiles.active=stub.

stt:
  stub:
    delay: 300ms                              # simulated upstream latency
    text: "This is a stub transcription."
    input-tokens: 100
    output-tokens: 10