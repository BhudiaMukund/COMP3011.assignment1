<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Speech to text</title>
    <link rel="stylesheet" href="styles.css" />
	<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,200..800&display=swap" rel="stylesheet">
  </head>

  <body>
    <main class="panel">
      <h1>Speech to Text</h1>
      <p class="intro">
        Record a short message and it will be transcribed for you.
      </p>

      <button
        id="recordButton"
        class="record"
        type="button"
        aria-pressed="false"
      >
        <span class="record__dot" aria-hidden="true"></span>
        <span id="recordLabel">Start recording</span>
      </button>

      <p id="status" class="status" role="status" aria-live="polite">Ready.</p>

      <section class="transcript" aria-labelledby="transcriptHeading">
        <h2 id="transcriptHeading">Transcript</h2>
        <output id="transcript" class="transcript__text" aria-live="polite">
          Nothing recorded yet.
        </output>
      </section>
    </main>

    <script src="app.js"></script>
  </body>
</html>
